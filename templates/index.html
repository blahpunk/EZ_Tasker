<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="{{ base_href }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ Tasker App</title>
    <!-- Quill.js and Sortable.js from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>EZ Tasker</h1>
            <div class="header-buttons">
                <a href="{{ url_for('logout') }}"><button>Logout</button></a>
            </div>
        </header>
        <button id="addTaskBtn">+ Add Task</button>

        <main>
            <div id="taskForm" style="display: none;">
                <input type="text" id="taskTitle" placeholder="Task Title">
                <input type="date" id="taskDueDate" placeholder="Due Date">
                <div id="editor-container"></div>
                <button id="saveTaskBtn">Save Task</button>
            </div>
            <div id="taskList">
                <p id="noTasksMessage" style="display:none;">No tasks yet. Click "Add Task" to get started.</p>
            </div>
        </main>
    </div>
    <!-- Quill JS and Sortable.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <!-- Load our custom scripts -->
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
