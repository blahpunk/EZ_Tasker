<!-- /var/www/tasklist/templates/login_prompt.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Required</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1c1c1e; color: #f2f2f7; text-align: center; padding-top: 50px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #0a84ff; border: none; color: #fff; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: #0066cc; }
        .card { display: inline-block; padding: 24px; background: #23232a; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
        p { color: #cfcfe6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>You are not logged in.</h1>
        <p>Please log in to view your tasks.</p>
        <a href="{{ login_url }}"><button>Login with Google</button></a>
    </div>
</body>
</html>
